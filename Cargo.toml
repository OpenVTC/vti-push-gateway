[package]
name = "vti-push-gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Push wake-up gateway for the OpenVTC mobile authenticator. Holds the app's platform push credentials, issues opaque wake handles, enforces a VTA-provisioned trigger allowlist, and relays contentless wake notifications. Implements https://trusttasks.org/binding/push/0.1."
repository = "https://github.com/OpenVTC/vti-push-gateway"
rust-version = "1.85"

[dependencies]
# HTTP surface (the REST gateway transport of the push binding). axum/tower
# mirror the trust-tasks-https binding's server stack.
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
# Trigger / provision authentication: callers sign the request body with their
# did:key Ed25519 key; the gateway resolves the did:key offline and verifies.
ed25519-dalek = "2"
bs58 = "0.5"
base64 = "0.22"
# Opaque handle generation (CSPRNG).
rand = "0.10"
# Canonical Trust Task envelope + the push/* payload types (the gateway's
# control plane is the push/* Trust Task family). The gateway dispatches
# push/register|provision|wake documents over HTTPS (and, next, DIDComm).
trust-tasks-rs = { version = "0.19.4", default-features = false }
# Response document ids (urn:uuid).
uuid = { version = "1", features = ["v4"] }
# DIDComm server transport (the preferred transport). Mirrors vta-service:
# DIDCommService + Router host that does server-side unpack + sender-auth; the
# gateway provides its provisioned did:webvh identity secrets + a Router of
# push/* handlers that call the shared dispatch_push core.
affinidi-messaging-didcomm-service = "0.7"
affinidi-tdk = "0.13"
affinidi-secrets-resolver = "0.5"
affinidi-did-resolver-cache-sdk = { version = "0.8", features = ["network"] }
tokio-util = "0.7"
# Async push senders (real delivery — Web Push / APNs — is async HTTP).
async-trait = "0.1"
# Web Push (RFC 8030/8291) payload encryption only — the `vapid` feature is
# deliberately disabled: it pulls jwt-simple's pure-rust backend (superboring →
# rsa), and rsa carries the unfixable Marvin-Attack advisory (RUSTSEC-2023-0071).
# VAPID (ES256 JWT, RFC 8292) is signed directly with `p256` instead, so the
# `rsa` crate never enters the tree. Delivery is a plain `reqwest` POST.
web-push-native = { version = "0.4", default-features = false }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
# `http2` is REQUIRED: Apple's APNs provider API is HTTP/2-only, and reqwest
# gates HTTP/2 behind this feature (off when `default-features = false`). Without
# it, APNs sends fail as a transient push-service error. Web Push tolerates
# HTTP/1.1, but APNs does not.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
http = "1"
# Web Push endpoint validation (egress policy). Already in the tree via reqwest;
# named directly to match on `url::Host`.
url = "2"
# FCM HTTP v1 authorises with an OAuth2 access token, obtained by signing a
# service-account assertion JWT with RS256. We sign with `aws-lc-rs` (already in
# the tree via rustls) so the vulnerable `rsa` crate (Marvin Attack,
# RUSTSEC-2023-0071) never enters — same "no rsa" stance as VAPID/APNs above.
aws-lc-rs = "1"
# Rate limiting in two layers. `governor` (GCRA) is the limiter itself, used
# directly inside the transport-agnostic dispatch core so that DIDComm — which
# never passes through axum middleware — is covered too. `tower_governor` is the
# HTTP-middleware wrapper around it, keyed by peer IP on the public router; it
# already targets axum 0.8.
governor = "0.10"
# `default-features = false` matters: the default feature set enables `tonic`,
# which drags a gRPC stack (and its own HTTP/2 and prost trees) into a crate that
# speaks neither. Only the axum integration is wanted.
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
# The store snapshot holds raw push tokens, so it is written through a private
# temp file: `NamedTempFile::new_in` gives an O_EXCL, mode-0600, unpredictably
# named file in the target directory, which a `with_extension("json.tmp")` path
# could not (guessable name, umask permissions). Was a dev-dependency until the
# snapshot write started using it.
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Paused-clock tests for the wake send timeout.
tokio = { version = "1", features = ["test-util"] }
