# cargo-deny configuration — supply-chain gate for the push gateway.
# Run with: cargo deny check
#
# Scope: keep the dependency tree free of known-vulnerable crates (notably the
# RustCrypto `rsa` Marvin-Attack advisory, which this crate is built to avoid —
# see Cargo.toml's web-push-native/p256 notes) and restrict licenses to a
# permissive allow-list.

[advisories]
# Fail on any security vulnerability or unsound advisory. Specific IDs may be
# suppressed below with a documented justification.
# Keep this list to advisories we genuinely cannot act on, each with a reason
# and a condition for removal. cargo-deny errors on an ignore that matches
# nothing, so a stale entry fails the check rather than rotting quietly — which
# is how RUSTSEC-2024-0370 (proc-macro-error unmaintained) left this list: it
# said "revisit when the affinidi crates drop it", and `affinidi-tdk` 0.8 did.
ignore = [
  # crypto-bigint: secret-dependent branches in operations meant to be
  # constant-time (RUSTSEC-2026-0387). Patched only in >= 0.7.6, which
  # Cargo.lock takes for the 0.7 line; there is no fixed 0.5 release. The
  # residue is 0.5.5, reached only through elliptic-curve 0.13 under p256 0.13 —
  # the curve the gateway signs VAPID (ES256) with and web-push-native encrypts
  # Web Push payloads with. web-push-native requires p256 ^0.13 in every release
  # through 0.5.0, so the gateway cannot leave 0.13 on its own. Remove when
  # web-push-native moves to p256 0.14, and move the VAPID signer with it.
  "RUSTSEC-2026-0387",
]

[licenses]
# Permissive licenses present in the current tree. OR-expressions (e.g.
# "MIT OR Apache-2.0") are satisfied by any one allowed term.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
# Allow duplicate versions (the affinidi/transitive tree carries several);
# flag only wildcard version requirements, which we don't use.
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Only crates.io. Add git sources here explicitly if ever needed.
unknown-registry = "deny"
unknown-git = "deny"
